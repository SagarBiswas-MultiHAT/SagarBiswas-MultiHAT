<svg viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mh-title mh-desc" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Segoe UI Mono',ui-monospace,Menlo,Consolas,monospace">
  <title id="mh-title">Sagar Biswas - MultiHAT Operations</title>
  <desc id="mh-desc">Security engineer, AI integrator, and full-stack developer, founder of MultiHAT, based in Dhaka, Bangladesh. Animated terminal-style profile banner.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050608"/>
      <stop offset="100%" stop-color="#090c12"/>
    </linearGradient>

    <!-- Tactical Radial Glow (Left / Text) -->
    <radialGradient id="glowLeft" cx="20%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#49d3ff" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#49d3ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#49d3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Tactical Radial Glow (Right / HUD) -->
    <radialGradient id="glowRight" cx="87%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#49d3ff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#49d3ff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#49d3ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Atmospheric Glow (Bottom-Left) -->
    <radialGradient id="glowWarm" cx="8%" cy="90%" r="35%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ff6b35" stop-opacity="0.012"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>

    <!-- Fine Tech Dot Matrix Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#49d3ff" fill-opacity="0.08"/>
    </pattern>

    <!-- CRT Scanline Overlay -->
    <pattern id="scan" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1" fill="#ffffff" opacity="0.02"/>
    </pattern>

    <!-- Film Grain Noise Overlay -->
    <pattern id="noise" width="120" height="6" patternUnits="userSpaceOnUse">
      <rect x="8" y="0" width="1" height="1" fill="#ffffff" opacity="0.012"/>
      <rect x="45" y="2" width="2" height="1" fill="#ffffff" opacity="0.008"/>
      <rect x="82" y="4" width="1" height="1" fill="#ffffff" opacity="0.015"/>
      <rect x="110" y="1" width="1" height="1" fill="#ffffff" opacity="0.010"/>
    </pattern>

    <!-- Underline Gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#49d3ff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#49d3ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#49d3ff" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#49d3ff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#49d3ff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Clip Path for typing 'sagar@multihat:~$ whoami' -->
    <clipPath id="clipPrompt">
      <rect x="100" y="104" width="0" height="38">
        <animate attributeName="width" calcMode="discrete" keyTimes="0.0;0.0417;0.0833;0.125;0.1667;0.2083;0.25;0.2917;0.3333;0.375;0.4167;0.4583;0.5;0.5417;0.5833;0.625;0.6667;0.7083;0.75;0.7917;0.8333;0.875;0.9167;0.9583;1.0" values="0.0;13.0;26.0;39.0;52.0;65.0;78.0;91.0;104.0;117.0;130.0;143.0;156.0;169.0;182.0;195.0;208.0;221.0;234.0;247.0;260.0;273.0;286.0;299.0;312.0" begin="0.15s" dur="1.15s" fill="freeze"/>
      </rect>
    </clipPath>

    <!-- Clip Path for typing wordmark 'Sagar Biswas' -->
    <clipPath id="clipName">
      <rect x="100" y="155" width="0" height="100">
        <animate attributeName="width" calcMode="discrete" keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0" values="0.0;40.0;80.0;120.0;160.0;200.0;240.0;280.0;320.0;360.0;400.0;440.0;480.0" begin="1.7s" dur="1.08s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 1. Backdrop Layers -->
  <rect width="1600" height="420" fill="url(#bgGrad)"/>
  <rect width="1600" height="420" fill="url(#glowLeft)"/>
  <rect width="1600" height="420" fill="url(#glowRight)"/>
  <rect width="1600" height="420" fill="url(#glowWarm)"/>
  <rect width="1600" height="420" fill="url(#grid)"/>
  <rect width="1600" height="420" fill="url(#scan)"/>
  <rect width="1600" height="420" fill="url(#noise)"/>

  <!-- 2. Cyber Perimeter Frame (Draw-in Animation) -->
  <rect x="14" y="14" width="1572" height="392" fill="none" stroke="#49d3ff" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3928" stroke-dashoffset="3928">
    <animate attributeName="stroke-dashoffset" from="3928" to="0" dur="1.2s" begin="0s" fill="freeze"/>
  </rect>

  <!-- Corner Brackets (Fade in during frame draw) -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.3s" fill="freeze"/>
    <path d="M14 36 L14 14 L36 14" fill="none" stroke="#49d3ff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M1586 36 L1586 14 L1564 14" fill="none" stroke="#49d3ff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M14 384 L14 406 L36 406" fill="none" stroke="#49d3ff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M1586 384 L1586 406 L1564 406" fill="none" stroke="#49d3ff" stroke-opacity="0.85" stroke-width="2"/>
  </g>

  <!-- Precision Edge Ticks (Center) -->
  <line x1="800" y1="14" x2="800" y2="22" stroke="#49d3ff" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="800" y1="406" x2="800" y2="398" stroke="#49d3ff" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="14" y1="210" x2="22" y2="210" stroke="#49d3ff" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="1586" y1="210" x2="1578" y2="210" stroke="#49d3ff" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Precision Edge Ticks (Quarter Positions) -->
  <g stroke="#49d3ff" stroke-opacity="0.25" stroke-width="0.8">
    <line x1="407" y1="14" x2="407" y2="20"/>
    <line x1="1193" y1="14" x2="1193" y2="20"/>
    <line x1="407" y1="406" x2="407" y2="400"/>
    <line x1="1193" y1="406" x2="1193" y2="400"/>
    <line x1="14" y1="112" x2="20" y2="112"/>
    <line x1="14" y1="308" x2="20" y2="308"/>
    <line x1="1586" y1="112" x2="1580" y2="112"/>
    <line x1="1586" y1="308" x2="1580" y2="308"/>
  </g>

  <!-- HUD L-Bracket Accents (1/3 Positions on Top Edge) -->
  <path d="M538 14 L538 22 L546 22" fill="none" stroke="#49d3ff" stroke-opacity="0.25" stroke-width="0.8"/>
  <path d="M1062 14 L1062 22 L1054 22" fill="none" stroke="#49d3ff" stroke-opacity="0.25" stroke-width="0.8"/>

  <!-- 3. Header Bar -->
  <!-- Pulsing Live Beacon Indicator -->
  <g transform="translate(100, 62)">
    <circle cx="0" cy="0" r="3.5" fill="#00ff88"/>
    <circle cx="0" cy="0" r="3.5" fill="none" stroke="#00ff88" stroke-width="1.2">
      <animate attributeName="r" values="3.5;10" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="116" y="66" font-size="13.5" font-weight="600" letter-spacing="2" fill="#49d3ff" fill-opacity="0.90">[ MULTIHAT // FIELD ENTRY ]</text>
  <text x="1500" y="66" font-size="13" letter-spacing="1.8" fill="#5c6677" text-anchor="end">DHAKA, BD  ·  UTC+06:00</text>

  <!-- Header Separator Rule -->
  <line x1="100" y1="80" x2="1500" y2="80" stroke="#49d3ff" stroke-opacity="0.10" stroke-width="0.5" stroke-dasharray="8 6"/>

  <!-- 4. Terminal Prompt Line: 'sagar@multihat:~$ whoami' -->
  <g clip-path="url(#clipPrompt)">
    <text x="100" y="130" font-size="22" textLength="312.0" lengthAdjust="spacing">
      <tspan fill="#49d3ff" font-weight="600">sagar@multihat</tspan><tspan fill="#5c6677">:</tspan><tspan fill="#a78bfa">~</tspan><tspan fill="#5c6677">$&#160;</tspan><tspan fill="#f3f5f8" font-weight="700">whoami</tspan>
    </text>
  </g>

  <!-- Mini Prompt Cursor -->
  <rect id="curPrompt" x="100" y="111" width="11" height="23" fill="#49d3ff" rx="1.5">
    <!-- Steps across the 24 characters with the clipPath -->
    <animate attributeName="x" calcMode="discrete" keyTimes="0.0;0.0417;0.0833;0.125;0.1667;0.2083;0.25;0.2917;0.3333;0.375;0.4167;0.4583;0.5;0.5417;0.5833;0.625;0.6667;0.7083;0.75;0.7917;0.8333;0.875;0.9167;0.9583;1.0" values="100.0;113.0;126.0;139.0;152.0;165.0;178.0;191.0;204.0;217.0;230.0;243.0;256.0;269.0;282.0;295.0;308.0;321.0;334.0;347.0;360.0;373.0;386.0;399.0;412.0" begin="0.15s" dur="1.15s" fill="freeze"/>
    <!-- Blinks once at the end of 'whoami', then vanishes cleanly -->
    <animate attributeName="opacity" values="1;1;0;1;0" keyTimes="0;0.7;0.8;0.9;1" begin="0.15s" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- 5. Wordmark: Sagar Biswas -->
  <g clip-path="url(#clipName)">
    <text x="100" y="238" font-size="72" font-weight="700" textLength="480.0" lengthAdjust="spacing" fill="#f3f5f8">Sagar Biswas</text>
  </g>

  <!-- Modern Refined Block Cursor -->
  <rect id="curName" x="100" y="176" width="16" height="64" fill="#49d3ff" rx="2" opacity="0">
    <!-- Fade in when name typing starts -->
    <animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.01s" fill="freeze"/>
    <!-- Step with the letters -->
    <animate attributeName="x" calcMode="discrete" keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0" values="100.0;140.0;180.0;220.0;260.0;300.0;340.0;380.0;420.0;460.0;500.0;540.0;580.0" begin="1.7s" dur="1.08s" fill="freeze"/>
    <!-- Steady terminal blink once typing finishes -->
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" begin="2.78s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Accent Underline Rule with Terminal Pip -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.5s" fill="freeze"/>
    <!-- Origin Pip -->
    <rect x="100" y="256" width="6" height="3" fill="#49d3ff"/>
    <!-- Gradient Rule Line -->
    <rect x="110" y="256" width="470.0" height="3" fill="url(#lineGrad)"/>
  </g>

  <!-- 6. Tagline Line -->
  <text x="100" y="312" font-size="20" letter-spacing="0.3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.05s" dur="0.5s" fill="freeze"/>
    <tspan fill="#b8c3d3">Security Engineer</tspan><tspan fill="#49d3ff" font-weight="700"> · </tspan><tspan fill="#b8c3d3">Full-Stack Developer</tspan><tspan fill="#49d3ff" font-weight="700"> · </tspan><tspan fill="#b8c3d3">AI Integrator</tspan><tspan fill="#49d3ff" font-weight="700"> · </tspan><tspan fill="#b8c3d3">Founder, MultiHAT</tspan>
  </text>

  <!-- 7. Metadata Technical Strip -->
  <text x="100" y="360" font-size="13.5" letter-spacing="2.2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.2s" dur="0.5s" fill="freeze"/>
    <tspan fill="#5c6677">FILE MH-2026-GH</tspan><tspan fill="#49d3ff" fill-opacity="0.6">  ·  </tspan><tspan fill="#5c6677">CLEARANCE: PUBLIC</tspan><tspan fill="#49d3ff" fill-opacity="0.6">  ·  </tspan><tspan fill="#5c6677">AIUB</tspan><tspan fill="#49d3ff" fill-opacity="0.6">  ·  </tspan><tspan fill="#5c6677">BANGLADESH</tspan>
  </text>

  <!-- 8. Tactical Command HUD / Radar Reticle (Right Quadrant) -->
  <g transform="translate(1380, 210)">
    <!-- Rotating Outer Segmented Ring -->
    <circle r="78" fill="none" stroke="#49d3ff" stroke-width="1.2" stroke-dasharray="10 8 3 8" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>

    <!-- Intermediate Range Ring (Outer) -->
    <circle r="68" fill="none" stroke="#49d3ff" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- Reverse Rotating Middle Ring -->
    <circle r="58" fill="none" stroke="#49d3ff" stroke-width="1" stroke-dasharray="26 12 4 12" stroke-opacity="0.50">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Intermediate Range Ring (Inner) -->
    <circle r="48" fill="none" stroke="#49d3ff" stroke-width="0.5" stroke-opacity="0.15"/>

    <!-- Static Inner Reference Ring -->
    <circle r="38" fill="none" stroke="#49d3ff" stroke-width="0.8" stroke-opacity="0.30"/>

    <!-- Active Radar Sweep Beam -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.8s" repeatCount="indefinite"/>
      <path d="M0 0 L0 -78 A78 78 0 0 1 55 -55 Z" fill="url(#radarSweep)"/>
      <line x1="0" y1="0" x2="0" y2="-78" stroke="#49d3ff" stroke-width="1.5" stroke-opacity="0.85"/>
    </g>

    <!-- Pulsing Blip Targets -->
    <circle cx="29" cy="-50" r="2.5" fill="#49d3ff">
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.15;0.7;1" dur="3.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="23" cy="64" r="2" fill="#00ff88">
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.2;0.65;1" dur="4.2s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-47" cy="8" r="1.8" fill="#49d3ff">
      <animate attributeName="opacity" values="0;0.6;0.6;0" keyTimes="0;0.1;0.75;1" dur="5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Reticle Cardinal Crosshairs -->
    <line x1="-96" y1="0" x2="-84" y2="0" stroke="#49d3ff" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="84" y1="0" x2="96" y2="0" stroke="#49d3ff" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="0" y1="-96" x2="0" y2="-84" stroke="#49d3ff" stroke-width="1.5" stroke-opacity="0.75"/>
    <line x1="0" y1="84" x2="0" y2="96" stroke="#49d3ff" stroke-width="1.5" stroke-opacity="0.75"/>

    <!-- Reticle Outer Degree Ticks -->
    <g stroke="#49d3ff" stroke-width="1" stroke-opacity="0.35">
      <line x1="55" y1="55" x2="61" y2="61"/>
      <line x1="-55" y1="55" x2="-61" y2="61"/>
      <line x1="55" y1="-55" x2="61" y2="-61"/>
      <line x1="-55" y1="-55" x2="-61" y2="-61"/>
    </g>

    <!-- Cardinal Direction Labels -->
    <text x="0" y="-102" font-size="8.5" fill="#49d3ff" fill-opacity="0.35" text-anchor="middle" letter-spacing="1">N</text>
    <text x="104" y="4" font-size="8.5" fill="#49d3ff" fill-opacity="0.35" text-anchor="middle" letter-spacing="1">E</text>
    <text x="0" y="108" font-size="8.5" fill="#49d3ff" fill-opacity="0.35" text-anchor="middle" letter-spacing="1">S</text>
    <text x="-104" y="4" font-size="8.5" fill="#49d3ff" fill-opacity="0.35" text-anchor="middle" letter-spacing="1">W</text>

    <!-- Center Monogram Target Core -->
    <circle r="22" fill="#49d3ff" fill-opacity="0.08" stroke="#49d3ff" stroke-width="1.2" stroke-opacity="0.85"/>
    <!-- Monogram Pulse Ring -->
    <circle r="22" fill="none" stroke="#49d3ff" stroke-width="1">
      <animate attributeName="r" values="22;34" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="6" font-size="16" font-weight="700" fill="#49d3ff" text-anchor="middle" letter-spacing="1">MH</text>
  </g>

  <!-- 9. Tactical Telemetry Sidebar Panel (Staggered Boot) -->
  <g transform="translate(1160, 160)">
    <!-- Tech boundary line -->
    <line x1="0" y1="0" x2="0" y2="115" stroke="#49d3ff" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 4" opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.0s" dur="0.4s" fill="freeze"/>
    </line>

    <!-- STATUS // ONLINE -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.15s" dur="0.4s" fill="freeze"/>
      <circle cx="8" cy="12" r="2" fill="#00ff88">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="16" y="16" font-size="11" letter-spacing="1.6" fill="#5c6677">STATUS // <tspan fill="#00ff88">ONLINE</tspan></text>
    </g>

    <!-- LOC -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.3s" dur="0.4s" fill="freeze"/>
      <text x="16" y="38" font-size="11" letter-spacing="1.6" fill="#5c6677">LOC // <tspan fill="#f3f5f8">23.81°N · 90.41°E</tspan></text>
    </g>

    <!-- OPS -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.45s" dur="0.4s" fill="freeze"/>
      <text x="16" y="60" font-size="11" letter-spacing="1.6" fill="#5c6677">OPS // <tspan fill="#49d3ff">OFF/DEF WEB-SEC</tspan></text>
    </g>

    <!-- CORE -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.6s" dur="0.4s" fill="freeze"/>
      <text x="16" y="82" font-size="11" letter-spacing="1.6" fill="#5c6677">CORE // <tspan fill="#f3f5f8">ACTIVE NODE</tspan></text>
    </g>

    <!-- LINK -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="0.65" begin="2.75s" dur="0.4s" fill="freeze"/>
      <text x="16" y="104" font-size="11" letter-spacing="1.6" fill="#5c6677">LINK // <tspan fill="#49d3ff">MULTIHAT.DEV</tspan></text>
    </g>
  </g>

  <!-- 10. Ambient Data Particles -->
  <circle cx="250" cy="420" r="1.2" fill="#49d3ff" opacity="0">
    <animate attributeName="cy" from="430" to="-10" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.08;0.08;0" keyTimes="0;0.1;0.85;1" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="420" r="0.9" fill="#49d3ff" opacity="0">
    <animate attributeName="cy" from="430" to="-10" dur="22s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.06;0.06;0" keyTimes="0;0.1;0.85;1" dur="22s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="420" r="1" fill="#49d3ff" opacity="0">
    <animate attributeName="cy" from="430" to="-10" dur="15s" begin="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.07;0.07;0" keyTimes="0;0.1;0.85;1" dur="15s" begin="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="420" r="1.1" fill="#49d3ff" opacity="0">
    <animate attributeName="cy" from="430" to="-10" dur="20s" begin="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.06;0.06;0" keyTimes="0;0.1;0.85;1" dur="20s" begin="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1450" cy="420" r="0.8" fill="#00ff88" opacity="0">
    <animate attributeName="cy" from="430" to="-10" dur="25s" begin="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.05;0.05;0" keyTimes="0;0.1;0.85;1" dur="25s" begin="10s" repeatCount="indefinite"/>
  </circle>

  <!-- 11. Horizontal CRT Scan Beam -->
  <rect x="14" y="14" width="1572" height="1.5" fill="#49d3ff" opacity="0.04">
    <animate attributeName="y" from="14" to="406" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
