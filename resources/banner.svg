<svg viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mh-title mh-desc" font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="mh-title">Sagar Biswas — MultiHAT Operations</title>
  <desc id="mh-desc">Security engineer, AI integrator, and full-stack developer, founder of MultiHAT, based in Dhaka, Bangladesh. Animated terminal-style profile banner.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </linearGradient>

    <radialGradient id="glow" cx="18%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#49d3ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#49d3ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#49d3ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="scan" width="100%" height="4" patternUnits="userSpaceOnUse">
      <rect width="100%" height="1" fill="#ffffff" opacity="0.025"/>
    </pattern>

    <clipPath id="clipA">
      <rect x="100" y="120" width="0" height="46">
        <animate attributeName="width" calcMode="discrete" keyTimes="0.0;0.0417;0.0833;0.125;0.1667;0.2083;0.25;0.2917;0.3333;0.375;0.4167;0.4583;0.5;0.5417;0.5833;0.625;0.6667;0.7083;0.75;0.7917;0.8333;0.875;0.9167;0.9583;1.0" values="0.0;13.9;27.7;41.6;55.4;69.3;83.2;97.0;110.9;124.7;138.6;152.4;166.3;180.2;194.0;207.9;221.7;235.6;249.5;263.3;277.2;291.0;304.9;318.7;332.6" begin="0s" dur="2.04s" fill="freeze"/>
      </rect>
    </clipPath>

    <clipPath id="clipB">
      <rect x="100" y="165" width="0" height="112">
        <animate attributeName="width" calcMode="discrete" keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0" values="0.0;44.6;89.3;133.9;178.6;223.2;267.9;312.5;357.1;401.8;446.4;491.1;535.7" begin="2.39s" dur="1.32s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>
  <rect width="1600" height="420" fill="url(#scan)"/>

  <!-- frame -->
  <rect x="14" y="14" width="1572" height="392" fill="none" stroke="#49d3ff" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M14 34 L14 14 L34 14" fill="none" stroke="#49d3ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M1586 34 L1586 14 L1566 14" fill="none" stroke="#49d3ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M14 386 L14 406 L34 406" fill="none" stroke="#49d3ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M1586 386 L1586 406 L1566 406" fill="none" stroke="#49d3ff" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- top-left / top-right tags -->
  <text x="100" y="66" font-size="14" letter-spacing="2.5" fill="#49d3ff" fill-opacity="0.85">[ MULTIHAT // FIELD ENTRY ]</text>
  <text x="1500" y="66" font-size="14" letter-spacing="1.5" fill="#5c6577" text-anchor="end">DHAKA, BD</text>

  <!-- row A: prompt (typed) -->
  <g clip-path="url(#clipA)">
    <text x="100" y="150" font-size="22" letter-spacing="0.5" fill="#49d3ff">sagar@multihat:~$ whoami</text>
  </g>
  <rect id="curA" x="100" y="128" width="13" height="26" fill="#49d3ff">
    <animate attributeName="x" calcMode="discrete" keyTimes="0.0;0.0417;0.0833;0.125;0.1667;0.2083;0.25;0.2917;0.3333;0.375;0.4167;0.4583;0.5;0.5417;0.5833;0.625;0.6667;0.7083;0.75;0.7917;0.8333;0.875;0.9167;0.9583;1.0" values="100.0;113.9;127.7;141.6;155.4;169.3;183.2;197.0;210.9;224.7;238.6;252.4;266.3;280.2;294.0;307.9;321.7;335.6;349.5;363.3;377.2;391.0;404.9;418.7;432.6" begin="0s" dur="2.04s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="2.04s" dur="0.2s" fill="freeze"/>
  </rect>

  <!-- row B: wordmark (typed) -->
  <g clip-path="url(#clipB)">
    <text x="100" y="250" font-size="72" font-weight="700" letter-spacing="-1" fill="#eef1f5">Sagar Biswas</text>
  </g>
  <rect id="curB" x="100" y="178" width="40" height="80" fill="#49d3ff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.39s" dur="0.01s" fill="freeze"/>
    <animate attributeName="x" calcMode="discrete" keyTimes="0.0;0.0833;0.1667;0.25;0.3333;0.4167;0.5;0.5833;0.6667;0.75;0.8333;0.9167;1.0" values="100.0;144.6;189.3;233.9;278.6;323.2;367.9;412.5;457.1;501.8;546.4;591.1;635.7" begin="2.39s" dur="1.32s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="3.71s" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- underline -->
  <rect x="100" y="268" width="535.7" height="3" fill="#49d3ff" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.91s" dur="0.6s" fill="freeze"/>
  </rect>

  <!-- row C: tagline -->
  <text x="100" y="306" font-size="21" fill="#aab4c4" opacity="0">
    Security Engineer · Full-Stack Developer · AI Integrator · Founder, MultiHAT
    <animate attributeName="opacity" from="0" to="1" begin="3.91s" dur="0.6s" fill="freeze"/>
  </text>

  <!-- row D: meta strip -->
  <text x="100" y="346" font-size="14.5" letter-spacing="2.5" fill="#5c6577" opacity="0">
    FILE MH-2026-GH  ·  CLEARANCE PUBLIC  ·  AIUB · BANGLADESH
    <animate attributeName="opacity" from="0" to="1" begin="4.01s" dur="0.6s" fill="freeze"/>
  </text>

  <!-- reticle mark -->
  <g opacity="0.5" transform="translate(1430,190)">
    <circle r="62" fill="none" stroke="#49d3ff" stroke-width="1"/>
    <circle r="40" fill="none" stroke="#49d3ff" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="-78" y1="0" x2="-70" y2="0" stroke="#49d3ff" stroke-width="1.5"/>
    <line x1="78" y1="0" x2="70" y2="0" stroke="#49d3ff" stroke-width="1.5"/>
    <line x1="0" y1="-78" x2="0" y2="-70" stroke="#49d3ff" stroke-width="1.5"/>
    <line x1="0" y1="78" x2="0" y2="70" stroke="#49d3ff" stroke-width="1.5"/>
    <text x="0" y="8" font-size="20" font-weight="700" fill="#49d3ff" text-anchor="middle" letter-spacing="1">MH</text>
  </g>
</svg>
